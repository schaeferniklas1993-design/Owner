{% extends "base.html" %}
{% from "_makros.html" import kategorie_select %}
{% block titel %}Dauerauftrag bearbeiten – Haushaltsbuch{% endblock %}
{% block inhalt %}
<div class="seitenkopf">
  <h1>Dauerauftrag bearbeiten</h1>
  <a class="knopf-sekundaer" href="{{ url_for('dauerauftraege') }}">Zurück</a>
</div>

<section class="karte">
  <form class="buchung-formular" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Art
      <select name="art" id="art-auswahl">
        <option value="ausgabe" {{ 'selected' if auftrag.art == 'ausgabe' }}>Ausgabe</option>
        <option value="einnahme" {{ 'selected' if auftrag.art == 'einnahme' }}>Einnahme</option>
      </select>
    </label>
    <label>Betrag (€)
      <input name="betrag" required inputmode="decimal"
             value="{{ '%.2f'|format(auftrag.betrag_cent / 100)|replace('.', ',') }}">
    </label>
    <label>Kategorie
      {{ kategorie_select(kategorien, auftrag.kategorie_id) }}
    </label>
    <label>Rhythmus
      <select name="intervall" id="intervall-auswahl">
        {% for monate, text in intervalle.items() %}
        <option value="{{ monate }}" {{ 'selected' if monate == auftrag.intervall_monate }}>{{ text|capitalize }}</option>
        {% endfor %}
      </select>
    </label>
    <label>Tag im Monat (1–28)
      <input type="number" name="monatstag" min="1" max="28" value="{{ auftrag.monatstag }}" required>
    </label>
    <label id="startmonat-feld">Erster Monat
      <select name="startmonat">
        {% for name in monatsnamen %}
        <option value="{{ loop.index }}" {{ 'selected' if loop.index == auftrag.startmonat }}>{{ name }}</option>
        {% endfor %}
      </select>
    </label>
    <label class="breit">Beschreibung
      <input name="beschreibung" required value="{{ auftrag.beschreibung }}">
    </label>
    <button type="submit">Änderungen speichern</button>
  </form>
</section>

<script src="{{ url_for('static', filename='formular.js') }}"></script>
<script>
  const intervallAuswahl = document.getElementById("intervall-auswahl");
  const startmonatFeld = document.getElementById("startmonat-feld");
  function startmonatUmschalten() {
    startmonatFeld.style.display = intervallAuswahl.value === "1" ? "none" : "flex";
  }
  intervallAuswahl.addEventListener("change", startmonatUmschalten);
  startmonatUmschalten();
</script>
{% endblock %}
