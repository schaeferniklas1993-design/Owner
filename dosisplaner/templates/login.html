{% extends "base.html" %}
{% block titel %}Anmelden – Mein Weg{% endblock %}
{% block inhalt %}
<div class="login-buehne">
  <form class="login-karte" method="post">
    <div class="login-logo">🌱</div>
    <h1>Mein Weg</h1>
    <p class="login-untertitel">Dein persönlicher Überblick. Nur für dich.</p>
    {% if fehler %}<div class="meldung meldung-fehler">{{ fehler }}</div>{% endif %}
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Benutzername
      <input name="benutzername" autocomplete="username" autofocus required>
    </label>
    <label>Passwort
      <span class="pw-feld">
        <input type="password" name="passwort" autocomplete="current-password" required>
        <button type="button" class="pw-auge" aria-label="Passwort anzeigen"
                title="Passwort anzeigen">👁</button>
      </span>
    </label>
    <button type="submit">Anmelden</button>
    <p class="login-untertitel" style="font-size:0.82rem">
      <a href="{{ url_for('hilfe') }}">Hilfe und Anlaufstellen</a>
    </p>
  </form>
</div>
{% endblock %}
{% block skripte %}
<script src="{{ url_for('static', filename='auswahl.js') }}"></script>
{% endblock %}
